app:
  name: Accounting
  business_function: BACK_OFFICE
  pillar: "Ledger Servicing"
  flow-enrichment:
    data-field: data
    frequency-field: frequency

spring:
  kafka:
    producer:
      bootstrap-servers: kafka.internal:9092
      topic: finance.cashflows
      consumed-by-application: Finance
      connection-kind: KAFKA
      message:
        data: cashflow
        frequency: monthly

api:
  cash-movements:
    path: /api/v1/cash-movements
    called-by-application: Settlement
    connection-kind: API
    data: cashflow
    frequency: daily

callers:
  - Settlement
