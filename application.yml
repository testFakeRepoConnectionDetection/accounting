app:
  name: Accounting
  flow-enrichment:
    data-category-field: data_category

spring:
  kafka:
    consumer:
      group-id: accounting-ledger
      topic: accounting.events
      produced-by-application: Booking
      message:
        data-category: ACCOUNTING_EVENT
        payload-format: AVRO
    producer:
      bootstrap-servers: kafka.internal:9092
      topic: ledger.balances
      consumed-by-application: Finance
      message:
        data-category: LEDGER_BALANCE
        payload-type: fixture.dto.LedgerBalanceEvent
        payload-format: AVRO

api:
  cash-movements:
    path: /api/v1/cash-movements
    data-category: CASH_MOVEMENT
    called-by-application: Settlement

callers:
  - Booking
  - Settlement
